name: Deploy web build

# Publishes the browser version of the game to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push:
    tags: ["v[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: ./web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-app/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
